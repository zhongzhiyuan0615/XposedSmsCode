name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  validate-release-metadata:
    name: Validate Release Metadata
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -n "$GITLAB_TOKEN" ]]; then
            git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          else
            echo "::notice::GITLAB_TOKEN secret not set; cloning public gitlab.com submodules anonymously"
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          java-version: '27'
      - name: Validate release notes and tag/version consistency
        run: |
          chmod +x scripts/release/check_release_guard.sh
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            scripts/release/check_release_guard.sh "${GITHUB_REF_NAME}"
          else
            echo "Skip formal release guard on beta branch; this pipeline publishes Alpha."
          fi
  build-github-apk:
    name: Build GitHub APK
    needs: [validate-release-metadata]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -n "$GITLAB_TOKEN" ]]; then
            git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          else
            echo "::notice::GITLAB_TOKEN secret not set; cloning public gitlab.com submodules anonymously"
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          java-version: '27'
      - name: Decode Keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > release.jks
      - name: Build GitHub APK with Splits
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: :app:assembleGithubRelease -PbuildSplits
        env:
          KEYSTORE_FILE: release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: apks-github
          path: app/build/outputs/apk/**/release/*.apk

  release:
    name: Create Release
    needs: [validate-release-metadata, build-github-apk]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.validate-release-metadata.result == 'success' && needs.build-github-apk.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE != '' }}
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -n "$GITLAB_TOKEN" ]]; then
            git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          else
            echo "::notice::GITLAB_TOKEN secret not set; cloning public gitlab.com submodules anonymously"
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks
      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          .magisk-ci-toolkit/release/release_notes.sh \
            --tag "$GITHUB_REF_NAME" \
            --package-name "com.github.tianma8023.xposed.smscode" \
            --source-repo "$GITHUB_REPOSITORY" \
            --generate-github-notes \
            --output release-notes.md
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_RELEASE_KEYSTORE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' release_assets < <(
            find artifacts/apks -type f -name '*.apk' -print0 2>/dev/null | sort -z
          )
          if [[ ${#release_assets[@]} -eq 0 ]]; then
            echo "ERROR: no release assets found under artifacts/apks" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --draft=false --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${release_assets[@]}" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi

  publish-modules-repo:
    name: Publish to Xposed-Modules-Repo
    needs: [build-github-apk]
    if: ${{ (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    env:
      HAS_MODULES_REPO_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN != '' }}
      MODULES_REPO: Xposed-Modules-Repo/com.github.tianma8023.xposed.smscode
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - uses: actions/download-artifact@v8
        with:
          name: apks-github
          path: artifacts/apks
      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
        run: |
          .magisk-ci-toolkit/release/release_notes.sh \
            --tag "$GITHUB_REF_NAME" \
            --package-name "com.github.tianma8023.xposed.smscode" \
            --source-repo "$GITHUB_REPOSITORY" \
            --generate-github-notes \
            --output release-notes.md
      - name: Publish Release in Xposed-Modules-Repo
        if: env.HAS_MODULES_REPO_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -d '' apk_files < <(find artifacts/apks -type f -name '*.apk' -print0 | sort -z)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "ERROR: no APK files found under artifacts/apks" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$MODULES_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apk_files[@]}" --repo "$MODULES_REPO" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$MODULES_REPO" --title "$GITHUB_REF_NAME" --draft=false --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${apk_files[@]}" --repo "$MODULES_REPO" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi

  release-notification:
    name: Release Notification
    needs: [release, publish-modules-repo]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.publish-modules-repo.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-26.04
    steps:
      - name: Write release status
        shell: bash
        run: |
          {
            echo "## Release status"
            echo ""
            echo "- Ref: $GITHUB_REF_NAME"
            echo "- GitHub Release: ${{ needs.release.result }}"
            echo "- Modules Repo: ${{ needs.publish-modules-repo.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  post-release-quality:
    name: Post-release Quality
    needs: [release, publish-modules-repo]
    if: always() && (vars.RELEASE_OWNER == '' || vars.RELEASE_OWNER == 'github') && startsWith(github.ref, 'refs/tags/') && needs.publish-modules-repo.result != 'failure' && needs.release.result != 'failure'
    runs-on: ubuntu-26.04
    steps:
      - name: Configure GitLab submodule credentials
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [[ -n "$GITLAB_TOKEN" ]]; then
            git config --global http.https://gitlab.com/.extraheader "AUTHORIZATION: basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)"
          else
            echo "::notice::GITLAB_TOKEN secret not set; cloning public gitlab.com submodules anonymously"
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/resolve-ci-toolkit
      - name: Setup Android CI
        uses: ./.magisk-ci-toolkit/.github/actions/setup-android-ci
        with:
          checkout: 'false'
          java-version: '27'
      - name: Run post-release quality gate
        uses: ./.magisk-ci-toolkit/.github/actions/run-gradle-with-retry
        with:
          arguments: >
            --warning-mode all
            :core:check
            :runtime:check
            :app:check
            :smscode-core:contract:test
            :smscode-core:domain:test
            :smscode-core:hook:testDebugUnitTest
            :smscode-core:runtime:testDebugUnitTest
            :smscode-core:verification:detekt
            :smscode-core:verification:test
            :magisk-xposed-kit:testDebugUnitTest
            :magisk-xposed-kit:logging:testDebugUnitTest
            :magisk-xposed-kit:diagnostics:testDebugUnitTest
            :app:koverVerifyGithubDebug
            -PenableKover=true
